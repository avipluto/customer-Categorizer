grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2

model_selection:
  module_0:
    class: CatBoostClassifier
    module: catboost
    params:
      iterations: 200
      learning_rate: 0.1
      depth: 6
      verbose: 0
      random_state: 42
    search_param_grid:
      iterations: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1]
      depth: [4, 6, 8]